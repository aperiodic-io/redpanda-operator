# aperiodic-io: builds and publishes the operator image for our patched release
# branches (aperiodic/*), tagged with the commit SHA. Same build as upstream's
# taskfiles/build.yml operator-image task: static binaries + operator/Dockerfile.
name: aperiodic image

on:
  push:
    branches:
      - "aperiodic/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Build binaries
        env:
          LD_FLAGS: >-
            -X "google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=ignore"
            -X "github.com/redpanda-data/redpanda-operator/operator/cmd/version.commit=${{ github.sha }}"
            -X "github.com/redpanda-data/redpanda-operator/operator/cmd/version.Version=${{ github.ref_name }}"
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -C ./operator \
              -o ../.build/redpanda-operator-linux-$arch -ldflags="$LD_FLAGS" ./cmd/main.go
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -C ./alias \
              -o ../.build/alias-linux-$arch -ldflags='-X "main.AliasTo=/redpanda-operator run"' .
          done

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .build
          file: operator/Dockerfile
          target: manager
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          push: true
          tags: ghcr.io/aperiodic-io/redpanda-operator:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
